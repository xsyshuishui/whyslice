[project]
name = "whyslice"
version = "0.1.0"
description = "On-demand dynamic causal slicing for coding agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8"]

[project.scripts]
whyslice = "whyslice.cli:main"
whyslice-mcp = "whyslice.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whyslice"]
